<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fidget spinner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="mainTitle">Fidget Spinner</h1>
    <div class="fidget-container">
        <div id="fidget1" aria-label="Click to spin the fidget spinner">
            <div class="circle" id="circle4"></div>
            <div id="rotating-container">
                <div class="circle" id="circle1"></div>
                <div class="circle" id="circle2"></div>
                <div class="circle" id="circle3"></div>
            </div>
            
        </div>

         <div id="fidget2" aria-label="Click to spin the fidget spinner">
            <img src="media/triangular.png" alt="triangular fidget spinner" id="triangular"> 
            </div> 
    </div>
    <script src="script.js"></script>
</body>
</html>
